schema_version: 1

context:
  python_min: "3.11.0"
  name: knowledge-graph-maker
  version: "0.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/knowledge_graph_maker-${{ version }}.tar.gz
  sha256: 00c54ff9bb7c557a885350144bfc328efae3676af03229390411902952094050

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - numpy >=1.26.2,<2.0.0
    - jupyterlab >=4.0.8,<5.0.0
    - yachalk >=0.1.5,<0.2.0
    - groq >=0.6.0,<0.7.0
    - python-dotenv >=1.0.1,<2.0.0
    - neo4j-python-driver 5.19.0.*
    - neomodel >=5.3.0,<6.0.0
    - openai >=1.28.0,<2.0.0

tests:
  - python:
      imports:
        - knowledge_graph_maker
      pip_check: false
      python_version: ${{ python_min }}
about:
  summary: Create knowledge graph out of any text using a given ontology
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/rahulnyk/knowledge_graph_maker

extra:
  recipe-maintainers:
    - jan-janssen
